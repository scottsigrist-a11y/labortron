<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MRBD Path Tracker</title>
    <meta name="description" content="Meta Ray-Ban Display GPS path tracking and territory area scoring game with no-license OpenStreetMap mapping." />
    <meta property="og:title" content="MRBD Path Tracker" />
    <meta property="og:description" content="Meta Ray-Ban Display GPS path tracking and territory area scoring game with no-license OpenStreetMap mapping." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-black text-white antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script>
      // Fallback for static hosts (Herald, GitHub Pages) serving repo root without a build step
      if (typeof window !== 'undefined' && !location.pathname.includes('/dist/') && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.indexOf('main.tsx') !== -1) {
            console.warn('Static host cannot parse raw TSX. Redirecting to compiled /dist/ bundle...');
            var base = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
            location.replace(base + '/dist/');
          }
        }, true);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
